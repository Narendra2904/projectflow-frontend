<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectFlow - Sign Up</title>
    <style>
        /* Light Theme Variables */
        :root {
            --primary: #4F46E5; --primary-hover: #4338CA;
            --surface: #ffffff; --background: #F3F4F6;
            --text-main: #111827; --text-muted: #6B7280;
            --border: #E5E7EB;
        }

        /* Dark Theme Variables */
        [data-theme="dark"] {
            --surface: #1F2937; --background: #111827;
            --text-main: #F9FAFB; --text-muted: #9CA3AF;
            --border: #374151;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; transition: background-color 0.3s, color 0.3s; }
        
        body { display: flex; min-height: 100vh; background-color: var(--background); color: var(--text-main); }

        .split-layout { display: flex; width: 100%; }
        
        /* Left Side - Branding */
        .left-pane { flex: 1; background: linear-gradient(135deg, #312E81, var(--primary)); color: white; padding: 4rem; display: flex; flex-direction: column; justify-content: center; }
        .left-pane h1 { font-size: 3rem; margin-bottom: 1.5rem; line-height: 1.2; }
        .left-pane p { font-size: 1.25rem; opacity: 0.9; line-height: 1.6; max-width: 400px; }
        
        /* Right Side - Form */
        .right-pane { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem; position: relative; background: var(--background); }
        
        .theme-toggle { position: absolute; top: 2rem; right: 2rem; background: var(--surface); border: 1px solid var(--border); color: var(--text-main); padding: 0.5rem 1rem; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 0.875rem; display: flex; align-items: center; gap: 0.5rem; }
        .theme-toggle:hover { background: var(--border); }

        .auth-container { background: var(--surface); padding: 3rem; border-radius: 1rem; border: 1px solid var(--border); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        .auth-container h2 { color: var(--text-main); margin-bottom: 0.5rem; font-size: 2rem; }
        .auth-container p.subtitle { color: var(--text-muted); margin-bottom: 2.5rem; font-size: 1rem; }
        
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; font-weight: 600; color: var(--text-main); }
        .form-group input, .form-group select { width: 100%; padding: 0.875rem; border: 1px solid var(--border); border-radius: 0.5rem; outline: none; background: var(--background); color: var(--text-main); }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary); }
        
        .btn-primary { width: 100%; background: var(--primary); color: white; border: none; padding: 0.875rem; border-radius: 0.5rem; cursor: pointer; font-weight: 600; font-size: 1rem; margin-top: 0.5rem; }
        .btn-primary:hover { background: var(--primary-hover); }
        
        .auth-footer { text-align: center; margin-top: 2rem; font-size: 0.9rem; color: var(--text-muted); }
        .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }

        @media (max-width: 768px) {
            .split-layout { flex-direction: column; }
            .left-pane { display: none; }
        }
    </style>
</head>
<body>

    <div class="split-layout">
        <!-- Left Branding Pane -->
        <div class="left-pane">
            <h1>Start organizing your team today.</h1>
            <p>Create an account to unlock role-based access, powerful task tracking, and seamless team collaboration.</p>
        </div>

        <!-- Right Form Pane -->
        <div class="right-pane">
            <!-- Theme Toggle -->
            <button class="theme-toggle" onclick="toggleTheme()">
                <span id="theme-icon">🌙</span> Dark Mode
            </button>

            <div class="auth-container">
                <h2>Create an account</h2>
                <p class="subtitle">Join ProjectFlow in seconds.</p>

                <form action="app.html" method="GET">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="you@company.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                    </div>

                    <button type="submit" class="btn-primary">Sign Up</button>
                </form>

                <div class="auth-footer">
                    Already have an account? <a href="login.html">Log in here</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Theme Toggle Script -->
    <script>
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const icon = document.getElementById('theme-icon');
            icon.textContent = theme === 'dark' ? '☀️' : '🌙';
            localStorage.setItem('theme', theme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(newTheme);
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        applyTheme(savedTheme);
    </script>
</body>
</html>
