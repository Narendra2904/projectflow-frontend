<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectFlow - Reset Password</title>
    <style>
        :root {
            --primary: #4F46E5;
            --surface: #ffffff;
            --background: #F3F4F6;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border: #E5E7EB;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { background-color: var(--background); color: var(--text-main); display: flex; justify-content: center; align-items: center; height: 100vh; }

        .auth-container { background: var(--surface); padding: 2.5rem; border-radius: 0.75rem; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        .auth-container h2 { text-align: center; color: var(--primary); margin-bottom: 0.5rem; font-size: 1.5rem; }
        .auth-container p.subtitle { text-align: center; color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem; line-height: 1.5; }

        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; font-weight: 600; color: var(--text-main); }
        .form-group input { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.375rem; outline: none; transition: border-color 0.2s; }
        .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }

        .btn-primary { width: 100%; background: var(--primary); color: white; border: none; padding: 0.75rem; border-radius: 0.375rem; cursor: pointer; font-weight: 600; font-size: 1rem; margin-bottom: 1rem; }
        .btn-primary:hover { opacity: 0.9; }

        .btn-secondary { width: 100%; background: var(--surface); color: var(--text-main); border: 1px solid var(--border); padding: 0.75rem; border-radius: 0.375rem; cursor: pointer; font-weight: 600; font-size: 1rem; text-decoration: none; display: block; text-align: center; }
        .btn-secondary:hover { background: var(--background); }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2>Reset your password</h2>
        <p class="subtitle">Enter the email address associated with your account and we'll send you a link to reset your password.</p>

        <!-- In a real app, this form would POST to an API route to generate a reset token -->
        <form action="login.html" method="GET">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@company.com" required>
            </div>
            
            <button type="submit" class="btn-primary" onclick="alert('Password reset link sent! (Demo)')">Send Reset Link</button>
            <a href="login.html" class="btn-secondary">Back to Login</a>
        </form>
    </div>

</body>
</html>
